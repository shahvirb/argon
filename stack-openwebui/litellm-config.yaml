# AI note: This is a litellm configuration file

general_settings:
  database_url: os.environ/DATABASE_URL
  websearch_interception: true

# Keep this at the TOP LEVEL of your YAML
search_tools:
  - search_tool_name: searxng-search
    litellm_params:                     # <--- This block is required
      search_provider: searxng
      api_base: "http://searxng:8080"

model_list:
  - model_name: gemini-2.5-flash-lite-preview
    litellm_params:
      model: gemini/gemini-2.5-flash-lite-preview-09-2025
      api_key: os.environ/GEMINI_API_KEY
  - model_name: gemini-2.5-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
  - model_name: gemini-2.5-pro
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GEMINI_API_KEY
  - model_name: gemini-3-pro-preview
    litellm_params:
      model: gemini/gemini-3-pro-preview
      api_key: os.environ/GEMINI_API_KEY
