name: stack-grafana_argon

services:
  loki:
    image: grafana/loki:latest
    container_name: loki
    user: "0:0"
    command: -config.file=/etc/loki/config.yaml
    ports:
      - "3100:3100"
    restart: unless-stopped
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml:ro
      - ${DOCKERDATADIR}/loki:/loki
    logging:
      driver: json-file
      options:
        max-file: "${DOCKERLOGGING_MAXFILE}"
        max-size: "${DOCKERLOGGING_MAXSIZE}"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    user: "472:472"
    dns_search:
      - fdatxvault.win
    environment:
      PGID: "${PGID}"
      PUID: "${PUID}"
      TZ: "${TZ}"
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - ${DOCKERDATADIR}/grafana:/var/lib/grafana
      - ./provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    logging:
      driver: json-file
      options:
        max-file: "${DOCKERLOGGING_MAXFILE}"
        max-size: "${DOCKERLOGGING_MAXSIZE}"
